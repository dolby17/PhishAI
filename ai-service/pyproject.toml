[project]
name = "phishai-scanner"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = ["fastapi", "uvicorn", "idna", "joblib", "scikit-learn", "tldextract"]

[project.optional-dependencies]
