services:
  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MONGO_URL: mongodb://mongo:27017/phishai
      AI_URL: http://ai:8000
      APP_ORIGIN: http://127.0.0.1:3000
      SESSION_SECRET: ${SESSION_SECRET:?Generate a random secret in .env first}
      COOKIE_SECURE: "false"
    depends_on:
      mongo:
        condition: service_healthy
      ai:
        condition: service_healthy
    networks: [runtime]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  ai:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    volumes:
      - ./ai-service/artifacts:/app/artifacts:ro
    networks: [runtime]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
  mongo:
    image: mongo:8.0
    command: [mongod, --bind_ip_all, --quiet]
    volumes: [mongo-data:/data/db]
    networks: [runtime]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
networks:
  runtime:
    internal: true
volumes:
  mongo-data:
